[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-aim"
version = "0.1.0"
description = "YOLOv8-powered configurable aim assistant framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.2.0",
  "opencv-python>=4.8.0",
  "numpy>=1.24.0",
  "PyYAML>=6.0",
  "mss>=9.0.1",
  "pyautogui>=0.9.54",
  "imgui[glfw]>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
ai-aimbot = "ai_aimbot.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
